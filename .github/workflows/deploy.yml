name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for GitHub Pages deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Fetch latest profile data
        run: |
          echo "Fetching latest release from my-career-data..."

          # Create public directory if it doesn't exist
          mkdir -p public

          # Download latest release artifacts
          gh release download \
            --repo benhuckvale/my-career-data \
            --pattern 'profile.json' \
            --pattern 'portrait.jpeg' \
            --dir public/ \
            --clobber

          echo "✓ Downloaded profile.json and portrait.jpeg"
          ls -lh public/
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_PRIVATE_REPO }}

      - name: Fetch latest blog data
        run: |
          echo "Fetching latest release from blog-posts..."

          # Create temp directory for download
          mkdir -p .temp-blog

          # Download blog.zip from blog-posts repo
          gh release download \
            --repo benhuckvale/blog-posts \
            --pattern 'blog.zip' \
            --dir .temp-blog/ \
            --clobber

          # Extract to public/ (creates blog.json and images/)
          unzip -o .temp-blog/blog.zip -d public/

          # Clean up
          rm -rf .temp-blog

          echo "✓ Downloaded and extracted blog.zip"
          ls -lh public/
          ls -lh public/images/post-images/ 2>/dev/null || echo "(no post-images directory)"
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_BLOG_POSTS }}

      - name: Build website and generate OG thumbnail
        run: npm run generate:thumbnail
        env:
          VITE_BASE_PATH: /profile-website

      # Note: Subsites are only integrated on production deployment
      # Staging (GitHub Pages) has a /profile-website path prefix that breaks subsite asset paths

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Summary
        run: |
          echo "✅ Website built and deployed to staging!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL**: https://benhuckvale.github.io/profile-website" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed from**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build time**: $(date)" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    needs: build-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Fetch latest profile data
        run: |
          echo "Fetching latest release from my-career-data..."
          mkdir -p public
          gh release download \
            --repo benhuckvale/my-career-data \
            --pattern 'profile.json' \
            --pattern 'portrait.jpeg' \
            --dir public/ \
            --clobber
          echo "✓ Downloaded profile.json and portrait.jpeg"
          ls -lh public/
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_PRIVATE_REPO }}

      - name: Fetch latest blog data
        run: |
          echo "Fetching latest release from blog-posts..."
          mkdir -p .temp-blog
          gh release download \
            --repo benhuckvale/blog-posts \
            --pattern 'blog.zip' \
            --dir .temp-blog/ \
            --clobber
          unzip -o .temp-blog/blog.zip -d public/
          rm -rf .temp-blog
          echo "✓ Downloaded and extracted blog.zip"
          ls -lh public/
          ls -lh public/images/post-images/ 2>/dev/null || echo "(no post-images directory)"
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_BLOG_POSTS }}

      - name: Build website for production and generate OG thumbnail
        run: npm run generate:thumbnail
        env:
          VITE_BASE_PATH: /

      - name: Fetch and integrate subsites
        run: npm run fetch-subsites
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_INFOGRAPHIC_JOURNEY }}
          PAT_FOR_INFOGRAPHIC_JOURNEY: ${{ secrets.PAT_FOR_INFOGRAPHIC_JOURNEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=profile-website --branch=main

      - name: Summary
        run: |
          echo "✅ Website deployed to production!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production deployment completed**" >> $GITHUB_STEP_SUMMARY
          echo "**Build time**: $(date)" >> $GITHUB_STEP_SUMMARY
